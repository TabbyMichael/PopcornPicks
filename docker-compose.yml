services:
  postgres:
    image: postgres:16-alpine
    container_name: popcornpicks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: popcornpicks
      POSTGRES_USER: popcornpicks
      POSTGRES_PASSWORD: popcornpicks
    ports:
      # Host 5433 to coexist with a local Homebrew Postgres on 5432.
      - '5433:5432'
    volumes:
      - popcornpicks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U popcornpicks -d popcornpicks']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  popcornpicks-pgdata:
